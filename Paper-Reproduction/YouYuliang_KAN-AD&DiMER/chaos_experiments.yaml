---
# Network Delay on frontend
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-delay-frontend
  namespace: default
spec:
  action: delay
  mode: one
  selector:
    labelSelectors:
      app: frontend
  delay:
    latency: "200ms"
    jitter: "50ms"
  duration: "2m"
  direction: to
---
# Network Loss on cartservice
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-loss-cart
  namespace: default
spec:
  action: loss
  mode: one
  selector:
    labelSelectors:
      app: cartservice
  loss:
    loss: "30"
  duration: "2m"
  direction: to
---
# CPU Stress on checkoutservice
apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: cpu-stress-checkout
  namespace: default
spec:
  mode: one
  selector:
    labelSelectors:
      app: checkoutservice
  stressors:
    cpu:
      workers: 2
      load: 80
  duration: "2m"
---
# Memory Stress on recommendationservice
apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: mem-stress-recommend
  namespace: default
spec:
  mode: one
  selector:
    labelSelectors:
      app: recommendationservice
  stressors:
    memory:
      workers: 1
      size: "128Mi"
  duration: "2m"
---
# Pod Kill on adservice
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: pod-kill-ad
  namespace: default
spec:
  action: pod-kill
  mode: one
  selector:
    labelSelectors:
      app: adservice
  gracePeriod: 0
---
# Network Delay on productcatalogservice
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-delay-product
  namespace: default
spec:
  action: delay
  mode: one
  selector:
    labelSelectors:
      app: productcatalogservice
  delay:
    latency: "300ms"
    jitter: "100ms"
  duration: "2m"
  direction: to
---
# CPU Stress on currencyservice
apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: cpu-stress-currency
  namespace: default
spec:
  mode: one
  selector:
    labelSelectors:
      app: currencyservice
  stressors:
    cpu:
      workers: 2
      load: 90
  duration: "2m"
---
# Network Loss on paymentservice
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-loss-payment
  namespace: default
spec:
  action: loss
  mode: one
  selector:
    labelSelectors:
      app: paymentservice
  loss:
    loss: "40"
  duration: "2m"
  direction: to
