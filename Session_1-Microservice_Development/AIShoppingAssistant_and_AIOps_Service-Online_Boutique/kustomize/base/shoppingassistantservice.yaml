apiVersion: apps/v1
kind: Deployment
metadata:
  name: shoppingassistantservice
  labels:
    app: shoppingassistantservice
spec:
  selector:
    matchLabels:
      app: shoppingassistantservice
  template:
    metadata:
      labels:
        app: shoppingassistantservice
    spec:
      containers:
      - name: server
        image: shoppingassistantservice
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 50051
        env:
        - name: PORT
          value: "50051"
        - name: DEEPSEEK_BASE_URL
          value: "https://api.deepseek.com"
        - name: DEEPSEEK_API_KEY
          value: "sk-"
        - name: DEEPSEEK_MODEL
          value: "deepseek-v4-pro"
        - name: QWEN_BASE_URL
          value: "https://dashscope.aliyuncs.com/compatible-mode/v1"
        - name: QWEN_API_KEY
          value: "sk-"
        - name: QWEN_VISION_MODEL
          value: "qwen3.7-plus"
        - name: QWEN_EMBEDDING_MODEL
          value: "text-embedding-v3"
---
apiVersion: v1
kind: Service
metadata:
  name: shoppingassistantservice
  labels:
    app: shoppingassistantservice
spec:
  type: ClusterIP
  selector:
    app: shoppingassistantservice
  ports:
  - name: grpc
    port: 50051
    targetPort: 50051
